<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Login - CyberTube AI System</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="dark-theme">
  <div class="ambient-background">
    <div class="glow-orb orb-red"></div>
    <div class="glow-orb orb-cyan"></div>
  </div>

  <div class="app-container">
    
    <div class="login-wrapper">
      
      <!-- Login Card -->
      <div class="login-card glass-panel">
        
        <div class="login-header">
          <div class="brand-logo admin-logo login-logo">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
          </div>
          <h1 class="login-title">Admin Access Portal</h1>
          <p class="login-subtitle">Enter your secret credentials to access system logs and file management.</p>
        </div>

        <!-- Error Alert -->
        <div id="loginErrorBanner" class="error-banner glass-panel hidden">
          <div class="error-icon">⚠️</div>
          <div class="error-text" id="loginErrorText">Invalid Username or Password. Access Denied.</div>
        </div>

        <form id="adminLoginForm" class="login-form">
          <div class="form-group">
            <label for="adminUsername" class="form-label">Admin Username ID</label>
            <div class="input-wrapper">
              <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <input type="text" id="adminUsername" class="url-input login-input" placeholder="Enter Admin ID..." required autocomplete="off">
            </div>
          </div>

          <div class="form-group">
            <label for="adminPassword" class="form-label">Admin Password</label>
            <div class="input-wrapper">
              <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <input type="password" id="adminPassword" class="url-input login-input" placeholder="Enter Password..." required autocomplete="off">
            </div>
          </div>

          <button type="submit" id="btnLoginSubmit" class="btn btn-primary btn-download glow-red login-submit-btn">
            <span id="loginBtnText">Authenticate Admin</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <div class="login-footer-actions">
          <a href="/" class="back-link">&larr; Return to Main App</a>
        </div>

      </div>

      <!-- Glowing Glass Footer Attribution -->
      <footer class="footer-glass glass-panel login-footer">
        <p class="credit-text">
          Created &amp; Developed by <span class="developer-glow">DARAAB KHAN</span>
        </p>
      </footer>

    </div>

  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value.trim();
      const errorBanner = document.getElementById('loginErrorBanner');
      const errorText = document.getElementById('loginErrorText');

      errorBanner.classList.add('hidden');

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/admin';
        } else {
          errorText.textContent = data.error || 'Invalid Admin Username or Password.';
          errorBanner.classList.remove('hidden');
        }
      } catch (err) {
        errorText.textContent = 'Network authentication error.';
        errorBanner.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
